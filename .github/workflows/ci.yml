name: CI

# Two callers:
#   - pull_request: lint/build/test only the apps a PR touches.
#   - workflow_call from deploy.yml: the same gates on a push to main/preprod, so nothing reaches
#     Coolify on Hostinger without passing them. deploy.yml reads the `changes` outputs to deploy
#     only the apps that changed; `all: true` (manual redeploy) runs every job regardless.
on:
  pull_request:
  workflow_call:
    inputs:
      all:
        type: boolean
        default: false
    outputs:
      frontend:
        value: ${{ jobs.changes.outputs.frontend }}
      admin:
        value: ${{ jobs.changes.outputs.admin }}
      owner:
        value: ${{ jobs.changes.outputs.owner }}
      backend:
        value: ${{ jobs.changes.outputs.backend }}

jobs:
  changes:
    if: ${{ !inputs.all }}
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      owner: ${{ steps.filter.outputs.owner }}
      app: ${{ steps.filter.outputs.app }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-panel/**'
            owner:
              - 'owner-web/**'
            app:
              - 'app/**'
            backend:
              - 'backend/**'

  # `!failure() && !cancelled()` rather than the implicit success(): when `changes` is skipped
  # (all: true), a plain `needs` would skip every job below with it.
  frontend:
    needs: changes
    if: ${{ !failure() && !cancelled() && (inputs.all || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  admin:
    needs: changes
    if: ${{ !failure() && !cancelled() && (inputs.all || needs.changes.outputs.admin == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # owner-web had no job at all, so owner-web-only PRs went green with every job skipped.
  owner:
    needs: changes
    if: ${{ !failure() && !cancelled() && (inputs.all || needs.changes.outputs.owner == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owner-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: owner-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # The mobile app is shipped through EAS, not Hostinger — type-checked on PRs only.
  mobile:
    needs: changes
    if: ${{ !failure() && !cancelled() && !inputs.all && needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  backend:
    needs: changes
    if: ${{ !failure() && !cancelled() && (inputs.all || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Node 22: backend/package.json and its Dockerfile both require it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
