# Deploy to Railway production only when a PR is merged into `main`.
# Direct pushes to the branch do not trigger this workflow.
name: Deploy Production

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-panel/**'

  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pin 5.2.0: CLI 5.3.0+ broke RAILWAY_TOKEN auth in non-interactive CI.
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0
        working-directory: .
      - name: Deploy backend to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up . \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment production \
            --service "${{ secrets.RAILWAY_SERVICE_BACKEND }}" \
            --ci \
            --path-as-root

  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0
        working-directory: .
      - name: Deploy frontend to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up . \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment production \
            --service "${{ secrets.RAILWAY_SERVICE_FRONTEND }}" \
            --ci \
            --path-as-root

  deploy-admin:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.2.0
        working-directory: .
      - name: Deploy admin to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up . \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment production \
            --service "${{ secrets.RAILWAY_SERVICE_ADMIN }}" \
            --ci \
            --path-as-root

  smoke:
    needs: [changes, deploy-backend, deploy-frontend, deploy-admin]
    if: |
      always() &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
      (needs.deploy-admin.result == 'success' || needs.deploy-admin.result == 'skipped') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-frontend.result == 'success' || needs.deploy-admin.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Smoke-check production URLs
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors \
            https://api.tejotime.com/healthz
          curl -fsSI --retry 5 --retry-delay 10 --retry-all-errors \
            https://www.tejotime.com | head -n 1
          curl -fsSI --retry 5 --retry-delay 10 --retry-all-errors \
            https://admin.tejotime.com | head -n 1
          echo "Production smoke checks passed."
