# Railway service config for the customer-facing Next.js microsite.
# deploy-bump: 2026-08-31 — rebuild tejotime-web (sync production deploy with main).
# Set the service's Root Directory to `frontend` in the Railway dashboard.
#
# NEXT_PUBLIC_* vars are baked in at BUILD time — Dockerfile declares them as
# ARGs so Railway's normal service variables also flow into the build stage
# (not automatic by default). Set them before the first deploy, and redeploy
# (not just restart) whenever they change. See Dockerfile.

[build]
# Explicit so it's obvious we build from ./Dockerfile rather than Nixpacks
# (deprecated on Railway — Railpack/Nixpacks auto-detection no longer applies).
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No custom start/health commands — the Dockerfile's CMD and Railway's default
# port-listening check are the single source of truth.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
