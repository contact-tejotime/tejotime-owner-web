# Railway service config for the customer-facing Next.js microsite.
# Set the service's Root Directory to `frontend` in the Railway dashboard.
#
# NEXT_PUBLIC_* vars are baked in at BUILD time — set them before the first
# deploy, and redeploy (not just restart) whenever they change.

[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev && npm run build"

[deploy]
startCommand = "npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
