# Railway service config for the API (Express + Socket.IO + node-cron).
# Set the service's Root Directory to `backend` in the Railway dashboard; the
# rest is versioned here. Env vars stay in the dashboard — see .env.example.
#
# DATABASE_URL should reference the Postgres service's PRIVATE url
# (postgres.railway.internal); the public proxy url is only for local tooling.

[build]
# Explicit so it's obvious we build from ./Dockerfile rather than Nixpacks.
# The Dockerfile's CMD is the start command — deliberately not repeated here.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only: /healthz never touches the database, so a first deploy can't
# deadlock waiting on a schema that hasn't been migrated yet. /readyz is the
# one that proves DB connectivity.
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Must stay 1. The Socket.IO adapter, the express-rate-limit store and the
# node-cron scheduler are all in-process — a second replica would split
# realtime rooms and run every cron sweep twice.
numReplicas = 1
